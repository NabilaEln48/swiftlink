[project]
name = "swiftlink"
version = "0.1.0"
description = "URL shortener API — FastAPI + Redis, base62 codes, rate limiting, click analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI TestClient runs on top of httpx
    "fakeredis>=2.20",  # in-memory Redis fake — tests need no real Redis server
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
